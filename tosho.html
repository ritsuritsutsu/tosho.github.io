<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図書館情報技術論</title>

<style>
body{
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;

    background: linear-gradient(
        to bottom,
        #fffef8 0%,
        #fff8dc 50%,
        #ffeeb8 100%
    );

    font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
    color: #6b5b3e;
}

.container{
    max-width: 950px;
    margin: auto;
}

h1{
    text-align: center;
    color: #b67c2e;
    font-size: 3em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 8px rgba(255,220,120,0.6);
}

h4{
    text-align: center;
    color: #8b6b3f;
    margin-top: 0;
    margin-bottom: 40px;
}

.note{
    position: relative;

    background: #fffdf8;

    border: 3px solid #e6c17d;
    border-radius: 30px;

    padding: 25px 30px;
    margin: 25px 0;

    box-shadow:
        0 8px 20px rgba(255,196,0,0.15),
        0 3px 8px rgba(0,0,0,0.08);

    line-height: 2;
}

.note::before{
    content: "🧸";
    position: absolute;
    top: -16px;
    left: 20px;
    font-size: 1.5em;
}

.note p{
    margin: 0;
}
</style>

</head>

<body>

<div class="container">

<h1>🧸 最近読んだ本 🧸</h1>
<h4>春木 律</h4>

<div class="note">
<p><strong>
『十角館の殺人』を読んだ。ネタバレを踏んでしまった状態で読んだのだが面白かった。犯人が分かっていても楽しめた。普段は文字を読むスピードが遅いのだが、すぐに読み終わって今は二週目を読んでいる。
</p></strong>

</div>


</div>

</body>
</html>
